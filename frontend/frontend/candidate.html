<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidate Profile | Inclusive Workforce</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Inclusive Workforce</h1>
        <p>Candidate Profile</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="candidate.html">Candidate</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

    <main>

        <section class="hero">

            <h2>Create Your Candidate Profile</h2>

            <form>

                <label for="name">Full Name</label>
                <br>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <br><br>

                <label for="email">Email</label>
                <br>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <label for="education">Education</label>
                <br>
                <input
                    type="text"
                    id="education"
                    placeholder="Enter your education"
                >

                <br><br>

                <label for="skills">Skills</label>
                <br>
                <input
                    type="text"
                    id="skills"
                    placeholder="e.g. HTML, Python, Communication"
                >

                <br><br>

                <label for="experience">Experience</label>
                <br>
                <textarea
                    id="experience"
                    placeholder="Describe your experience"
                    rows="5"
                ></textarea>

                <br><br>

                <label for="work">Preferred Work Type</label>
                <br>

                <select id="work">
                    <option value="remote">Remote</option>
                    <option value="hybrid">Hybrid</option>
                    <option value="onsite">On-site</option>
                </select>

                <br><br>

                <h3>Accessibility Preferences</h3>

                <label>
                    <input type="checkbox">
                    Flexible working hours
                </label>

                <br>

                <label>
                    <input type="checkbox">
                    Screen-reader friendly
                </label>

                <br>

                <label>
                    <input type="checkbox">
                    Accessible workplace
                </label>

                <br>

                <label>
                    <input type="checkbox">
                    Sign-language support
                </label>

                <br><br>

                <button type="submit">
                    Save Profile
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Inclusive Workforce</p>
    </footer>

</body>

</html>
